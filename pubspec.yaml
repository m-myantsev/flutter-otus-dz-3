name: recipes
description: "Книга рецептов Otus.Food"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_litert: ^3.9.4
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  image: ^4.12.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  rive: ^0.14.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.11.2
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/rive/
    - assets/models/
